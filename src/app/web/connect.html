<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Your card · Agent Cards</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  /* Flat, solid colour only: this page overrides the shared glass and glow layer in site.css. */
  .card,.stat,.agent,.empty,.tabs,.nav,.next-step{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-color:var(--line)}
  .card:hover,.agent:hover,.stat:hover{transform:none;border-color:var(--line)}
  .nav{background:var(--bg)}
  .empty{background:transparent}
  input,select,textarea{background:var(--surface);box-shadow:none}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);box-shadow:none}
  input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad);box-shadow:none}
  input[aria-invalid="true"]:focus,select[aria-invalid="true"]:focus{outline-color:var(--bad)}
  .btn.accent,button.accent,.btn.accent:hover,button.accent:hover:not(:disabled){box-shadow:none}
  .btn:hover,button:hover:not(:disabled){transform:none}
  button{min-height:40px}
  button.danger{border-color:var(--bad);color:var(--bad)}
  button.danger.solid{background:var(--bad);color:#fff}

  .page{max-width:640px;margin:0 auto;padding:28px 18px 64px;display:grid;gap:18px}
  #view{display:grid;gap:18px}
  #view>.stack{gap:18px}
  .page h1{font-size:26px}
  h1[tabindex="-1"]:focus{outline:none}
  .page .lede{color:var(--ink2);margin:6px 0 0}
  .stack{display:grid;gap:14px}
  .stack>*{min-width:0}
  .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (max-width:420px){.two{grid-template-columns:minmax(0,1fr)}}
  .hint{font-size:12.5px;color:var(--muted);font-weight:400}
  .err{color:var(--bad);font-size:13px;font-weight:500}
  .err:empty{display:none}
  .banner{border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;background:var(--bg2)}
  .banner.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
  .banner.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
  .banner.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
  .privacy{font-size:13.5px;color:var(--ink2);display:flex;gap:8px;align-items:center}

  .progress{display:flex;gap:6px;margin:0;padding:0;list-style:none}
  .progress li{flex:1;height:5px;border-radius:9px;background:var(--line2)}
  .progress li.on{background:var(--accent)}
  .stepname{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
  fieldset{border:0;margin:0;padding:0;display:grid;gap:14px;min-width:0}
  legend{font:650 20px var(--display);letter-spacing:-.02em;padding:0;margin-bottom:6px}
  .actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
  .actions .grow{flex:1}
  .photo{display:grid;gap:10px}
  .photo img{max-width:100%;max-height:200px;border-radius:var(--r-sm);border:1px solid var(--line);object-fit:contain;background:var(--bg2)}
  .photo input[type=file]{padding:9px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
  .kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

  .center{text-align:center;justify-items:center;padding:34px 22px}
  .center h1,.center h2{font-size:22px}
  .center p{max-width:44ch;margin:0}
  .spinner{width:28px;height:28px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .skel{height:16px;border-radius:6px;background:var(--bg2)}

  .stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .lbl{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .stat b{display:block;font:650 22px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0}
  .agent{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
  .agent.revoked{opacity:.75}
  .agent .head{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:start}
  .agent .name{font:650 17px var(--display)}
  .empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
  .totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .agent .name{overflow-wrap:anywhere}
  .agent .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .agent details{border-top:1px solid var(--line);padding-top:12px}
  .agent summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;min-height:32px}
  .agent details>form,.agent details>.stack{margin-top:10px}
  .money{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .money label{flex:1;min-width:120px}
  .inputwrap{position:relative}
  .inputwrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .inputwrap input{padding-left:24px}
  .confirm{border:1px solid var(--bad);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:10px;background:var(--bad-soft)}
  .confirm p{margin:0;font-size:14px}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  [hidden]{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav"><div class="wrap">
  <span class="brand"><span class="logo" aria-hidden="true"></span>Agent Cards</span>
  <span class="spacer"></span>
  <button class="icon-btn" data-theme-toggle type="button"></button>
</div></header>
<main id="main" class="page" tabindex="-1">
  <div id="view" aria-busy="true"><noscript><p>This page needs JavaScript.</p></noscript></div>
</main>
<div id="status" class="sr" role="status" aria-live="polite"></div>
<script src="/assets/site.js"></script>
<script src="/assets/connect.js"></script>
</body>
</html>
