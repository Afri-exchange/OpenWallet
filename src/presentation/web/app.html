<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Dashboard · Spendkit</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  .auth{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;min-height:calc(100vh - var(--nav-h) - 80px);padding:48px 0}
  .auth h1{font-size:clamp(32px,4.4vw,52px);margin-bottom:14px}
  .auth .lede{font-size:17px;color:var(--ink2);max-width:46ch;margin-bottom:26px}
  .tabs{display:inline-flex;gap:2px;padding:3px;background:var(--bg2);border-radius:11px;border:1px solid var(--line);margin-bottom:16px}
  .tabs button{border:0;background:none;padding:8px 16px;border-radius:8px;color:var(--ink2);font-weight:550}
  .tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .auth{overflow-x:clip}
  .art{display:grid;justify-items:center;gap:22px;position:relative}
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;padding:32px 0 0;align-items:start}
  .side{position:sticky;top:calc(var(--nav-h) + 24px);display:grid;gap:4px}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:550;font-size:14px}
  .side a:hover{background:var(--bg2);color:var(--ink)}
  .side a[aria-current]{background:var(--accent-soft);color:var(--accent)}
  .side svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 0;width:100%}
  .panel{display:grid;gap:20px}
  .panel[hidden]{display:none}
  .ph{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  .ph h1{font-size:28px} .ph p{margin:6px 0 0;color:var(--muted)}
  .hero{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:center}
  .vcard .bal{font:650 30px var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .vcard .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
  .stat{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
  .stat .lbl{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .stat b{display:block;font:650 24px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0}
  .stat .note{display:block;margin-top:6px;color:var(--muted)}
  .steps{display:grid;gap:0;counter-reset:s;list-style:none;margin:0;padding:0}
  .steps li{display:flex;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .steps li:last-child{border-bottom:0}
  .steps .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:var(--muted)}
  .steps li.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
  .steps li.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
  .steps li.next .tick{border-color:var(--accent);color:var(--accent)}
  .steps .t{flex:1;font-weight:550} .steps .t small{display:block;font-weight:400;color:var(--muted)}
  .addr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .addr .mono{flex:1;min-width:0;word-break:break-all;font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .agent{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;background:var(--surface)}
  .agent.revoked{opacity:.7}
  .agent .head{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:start}
  .agent .name{font:650 17px var(--display)}
  .secret{border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:18px;display:grid;gap:12px}
  .secret .tok{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .secret .tok .mono{flex:1;min-width:0;word-break:break-all}
  .empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
  .pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
  .res .meta{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  details.fold summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px;margin:0}
  .kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
  @media (max-width:900px){
    .auth{grid-template-columns:1fr;gap:32px;padding:28px 0}.art{order:-1}.art .vcard{max-width:300px}
    .shell{grid-template-columns:1fr;gap:16px;padding-top:16px}
    .side{position:sticky;top:var(--nav-h);z-index:40;display:flex;overflow-x:auto;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin:0 -24px;padding-left:24px;padding-right:24px}
    .side hr,.side .desk{display:none} .side a{white-space:nowrap}
    .hero,.pg{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav"><div class="wrap">
  <a class="brand" href="/"><span class="logo" aria-hidden="true"></span>Spendkit</a>
  <span class="pill">Sandbox</span>
  <nav class="nav-links" aria-label="Primary"><a href="/">Product</a><a href="/docs">Docs</a><a href="/app#developers" class="keep">Developers</a></nav>
  <span class="spacer"></span>
  <span id="who" class="muted small"></span>
  <button class="icon-btn" data-theme-toggle type="button"></button>
</div></header>
<div class="wrap" id="root"><noscript><p>The dashboard needs JavaScript.</p></noscript></div>
<div id="msg" role="status" aria-live="polite"></div>
<script src="/assets/site.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
